name: Publish live-view fix images

on:
  push:
    branches:
      - ci/publish-live-view-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: steel-browser-api
            dockerfile: ./api/Dockerfile
            title: Steel Browser API (live view fix)
            scope: api
          - image: steel-browser-ui
            dockerfile: ./ui/Dockerfile
            title: Steel Browser UI (live view fix)
            scope: ui
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tag from the fix commit
        id: tag
        run: |
          fix_sha="$(git rev-parse --short=7 HEAD^)"
          echo "fix_sha=${fix_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=fix-live-view-${fix_sha}" >> "$GITHUB_OUTPUT"

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Custom Steel Browser image for the live view session ID fix

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Write deployment summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "- Image: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}\`"
            echo "- Fix commit: \`${{ steps.tag.outputs.fix_sha }}\`"
            echo "- Build commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
